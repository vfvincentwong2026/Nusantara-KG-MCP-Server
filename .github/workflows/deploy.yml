📊 监控与日志
Cloudflare Dashboard
Workers 请求数 / 错误率

R2 存储用量

D1 查询性能

日志查看
bash
npx wrangler tail
# 实时查看 Worker 日志
🔒 安全建议
API 密钥: 使用 MCP_API_KEY 环境变量，所有请求需携带 Authorization: Bearer {key}

CORS: 只允许白名单域名访问

限流: 使用 Cloudflare Rate Limiting 防止滥用

R2 权限: 使用预签名 URL 或公开读+CDN 缓存

🚨 回滚
bash
npx wrangler rollback
# 回滚到上一个版本
或使用 Cloudflare Dashboard 的版本管理功能。
